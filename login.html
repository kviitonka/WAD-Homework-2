<!DOCTYPE html>
<html class="html" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- mobile usage -->
    <link rel="stylesheet" href="login.css">
    <title>PostIt - Login</title>
</head>


<body>

    <!-- menu bar -->
    <header>
        <a href="index.html">Home</a> <!-- navigates to home -->
        <nav>
            <img src="images/daweid-icon-7797704_1920.png" alt="User Avatar" width="80" height="80"> <!-- profile icon -->
        </nav>
    </header>

    <!-- login box -->
    <form action="index.html" method="post"> <!-- login button redirects to home -->
        <p><strong>Welcome to PostIt</strong></p><br>
        <p class="blue"> Create an account</p>
        <p>or</p><br>
        <p>Please log in</p><br>
        <input type="email" placeholder="Email" required><br> <!-- input box -->
        <input type="password" placeholder="Password" required><br> <!-- input box -->
        <button class="logInButton">Log in</button><br>
        <p class="blue">Forgot password</p>
    </form>

</body>

</html>
